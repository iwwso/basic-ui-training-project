<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelter Animals</title>
    <style>
        body { font-family: sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
        nav { background: #f1f5f9; padding: 0.6rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; }
        nav a { margin-right: 1rem; text-decoration: none; color: #2563eb; }
        nav a:hover, nav a:focus { text-decoration: underline; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 0.4rem; }
        ul { list-style: none; padding: 0; }
        li { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1rem;
             display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
        li img { border-radius: 4px; max-width: 100%; }
        .info { flex: 1; min-width: 220px; }
        .info h2 { margin: 0 0 0.3rem; }
        .status-available { color: #15803d; font-weight: bold; }
        .status-adopted   { color: #555;    font-weight: bold; }
        .add-link { display: inline-block; padding: 0.6rem 1.2rem; background: #2563eb; color: white;
                    border-radius: 4px; text-decoration: none; }
        .add-link:hover, .add-link:focus { background: #1d4ed8; }
    </style>
</head>
<body>

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main>
    <h1>Shelter Animals</h1>

    <p th:if="${#lists.isEmpty(animals)}">There are no animals in the shelter yet.</p>

    <section aria-label="Animal list" th:unless="${#lists.isEmpty(animals)}">
        <ul>
            <li th:each="animal : ${animals}">
                <img th:src="${animal.imageUrl}"
                     th:alt="|Photo of ${animal.name}|"
                     width="300"
                     height="200"
                     style="object-fit: cover;">
                <div class="info">
                    <h2 th:text="${animal.name}">Name</h2>
                    <p>
                        <span th:text="${animal.type}">TYPE</span>
                        | <span th:text="${animal.breed} ?: 'Unknown breed'">Breed</span>
                        | Age: <span th:text="${animal.age} ?: 'unknown'">0</span>
                    </p>
                    <p th:text="${animal.description}">Description</p>
                    <p>
                        Status:
                        <span th:text="${animal.status}"
                              th:class="${animal.status.name() == 'ADOPTED'} ? 'status-adopted' : 'status-available'">AVAILABLE</span>
                        <span th:if="${animal.adoptionNote != null}" th:text="|(${animal.adoptionNote})|">(adopted on ...)</span>
                    </p>
                </div>
            </li>
        </ul>
    </section>

    <a th:href="@{/animals/new}" class="add-link">Add animal</a>
</main>

</body>
</html>
